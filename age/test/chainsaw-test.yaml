apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: verify-age-extension
spec:
  timeouts:
    apply: 5s
    assert: 3m
    delete: 30s
  description: Verify a non-superuser can create and query graphs with Apache AGE
  steps:
  - name: Create a Cluster with the extension
    try:
    - apply:
        file: cluster.yaml
    - apply:
        file: database.yaml
    - assert:
        file: cluster-assert.yaml
    - assert:
        file: database-assert.yaml

  - name: Verify graph queries as the application user
    try:
    - apply:
        file: check-extension.yaml
    - assert:
        file: check-extension-assert.yaml
