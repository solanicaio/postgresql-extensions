apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: verify-pg-partman-extension
spec:
  timeouts:
    apply: 5s
    assert: 3m
    delete: 30s
  description: Verify a non-superuser can partition a table and the background worker maintains it
  steps:
  - name: Create a Cluster with the extension
    try:
    - apply:
        file: cluster.yaml
    - apply:
        file: database.yaml
    - assert:
        file: cluster-assert.yaml
    - assert:
        file: database-assert.yaml

  - name: Verify the background worker premakes partitions as the application user
    try:
    - apply:
        file: check-extension.yaml
    - assert:
        file: check-extension-assert.yaml
