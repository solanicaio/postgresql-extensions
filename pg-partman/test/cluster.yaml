apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ($values.name)
spec:
  imageName: ($values.pg_image)
  instances: 1

  # CREATE EXTENSION runs as the superuser through the Database resource, so
  # give app the privileges pg_partman needs on its schema and config tables.
  bootstrap:
    initdb:
      postInitApplicationSQL:
        - CREATE SCHEMA partman
        - GRANT ALL ON SCHEMA partman TO app
        - ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA partman GRANT ALL ON TABLES TO app

  storage:
    size: 1Gi

  postgresql:
    # Run maintenance every few seconds instead of every hour.
    parameters: '(merge($values.postgresql_parameters, {"pg_partman_bgw.interval": `"5"`}))'
    shared_preload_libraries: ($values.shared_preload_libraries)
    extensions: ($values.extensions)
