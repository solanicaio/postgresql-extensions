apiVersion: batch/v1
kind: Job
metadata:
  name: extension-installed
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: data-test
          env:
            - name: PGSSLROOTCERT
            - name: EXT_VERSION
              value: ($values.version)
            - name: DB_URI
              valueFrom:
                secretKeyRef:
                  name: (join('-', [$values.name, 'app']))
                  key: uri
          image: alpine/psql:18.6@sha256:08f354a83552fcefa508116268463b371717577fe49d3fcb7b82cf8d2be464b8
          command: ["sh", "-c"]
          args:
            - |
              set -e
              DB_URI=$(echo "$DB_URI" | sed "s|/\*|/|")
              test "$(psql "$DB_URI" -tAqc "SELECT rolsuper FROM pg_roles WHERE rolname = current_user")" = "f"
              test "$(psql "$DB_URI" -tAqc "SELECT extversion FROM pg_extension WHERE extname = 'timescaledb'")" = "${EXT_VERSION}"
              test "$(psql "$DB_URI" -tAqc "SHOW timescaledb.license")" = "apache"
              psql "$DB_URI" -q -v ON_ERROR_STOP=1 <<'SQL'
              CREATE TABLE metrics (time timestamptz NOT NULL, value double precision);
              SELECT create_hypertable('metrics', by_range('time', INTERVAL '1 day'));
              INSERT INTO metrics VALUES (now(), 42);
              CREATE OR REPLACE PROCEDURE test_timescale_job()
              LANGUAGE plpgsql AS $$
              BEGIN
                UPDATE metrics SET value = value;
              END
              $$;
              SELECT add_job('test_timescale_job', INTERVAL '1 hour', initial_start => now() + INTERVAL '1 hour');
              SELECT run_job(job_id) FROM timescaledb_information.jobs
              WHERE proc_schema = 'public' AND proc_name = 'test_timescale_job';
              SQL
              test "$(psql "$DB_URI" -tAqc "SELECT count(*) FROM metrics")" = "1"
              echo "TimescaleDB Apache-2.0 extension and background job work!"
