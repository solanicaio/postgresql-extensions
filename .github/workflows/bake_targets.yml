name: Build, test and publish a target extension

on:
  workflow_call:
    inputs:
      extension_name:
        description: "The PostgreSQL extension to build (directory name)"
        required: true
        type: string
    secrets:
      SNYK_TOKEN:
        required: false

permissions: {}

jobs:
  testbuild:
    name: Build ${{ inputs.extension_name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push by digest
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7
        id: build
        env:
          BUILDX_METADATA_PROVENANCE: disabled
          architecture: ${{ matrix.arch }}
          environment: testing
          registry: ghcr.io/${{ github.repository_owner }}
          revision: ${{ github.sha }}
        with:
          files: ./docker-bake.hcl,./${{ inputs.extension_name }}/metadata.hcl
          push: true
          set: |
            *.platform=linux/${{ matrix.arch }}

      - name: Save build metadata
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          printf '%s' "$BUILD_METADATA" > "metadata-${{ matrix.arch }}.json"

      - name: Upload build metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.extension_name }}-metadata-${{ matrix.arch }}
          path: metadata-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 1

  merge-images:
    name: Merge ${{ inputs.extension_name }} images
    runs-on: ubuntu-26.04
    needs:
      - testbuild
    permissions:
      packages: write
      id-token: write
    outputs:
      metadata: ${{ steps.merge.outputs.metadata }}
      images: ${{ steps.images.outputs.images }}
    steps:
      - name: Log in to the GitHub Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Download build metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c809b3 # v4.3.0
        with:
          pattern: ${{ inputs.extension_name }}-metadata-*
          path: metadata
          merge-multiple: true

      - name: Create multi-arch manifests
        id: merge
        run: |
          amd64="metadata/metadata-amd64.json"
          arm64="metadata/metadata-arm64.json"
          test -s "$amd64"
          test -s "$arm64"
          merged="[]"

          for target in $(jq -r 'keys[]' "$amd64"); do
            if ! jq -e --arg target "$target" 'has($target)' "$arm64" >/dev/null; then
              echo "::error::Missing arm64 build target ${target}" >&2
              exit 1
            fi

            amd64_names=$(jq -r --arg target "$target" '.[ $target ]."image.name"' "$amd64")
            arm64_names=$(jq -r --arg target "$target" '.[ $target ]."image.name"' "$arm64")
            names=$(sed -E 's/-amd64([,]|$)/\1/g' <<< "$amd64_names")
            expected_names=$(sed -E 's/-arm64([,]|$)/\1/g' <<< "$arm64_names")
            if [[ "$names" != "$expected_names" ]]; then
              echo "::error::Architecture tag mismatch for ${target}" >&2
              exit 1
            fi

            amd64_digest=$(jq -r --arg target "$target" '.[ $target ]."containerimage.digest"' "$amd64")
            arm64_digest=$(jq -r --arg target "$target" '.[ $target ]."containerimage.digest"' "$arm64")
            repository="${names%%,*}"
            repository="${repository%:*}"
            tag_args=()
            while IFS= read -r tag; do
              tag_args+=("-t" "$tag")
            done < <(tr ',' '\n' <<< "$names")

            docker buildx imagetools create "${tag_args[@]}" \
              "${repository}@${amd64_digest}" \
              "${repository}@${arm64_digest}"

            timestamp_tag=$(tr ',' '\n' <<< "$names" | grep -E '[0-9]{12}-' | head -n1)
            manifest_digest=$(docker buildx imagetools inspect "$timestamp_tag" |
              awk '/^Digest:/ { print $2; exit }')
            if [[ -z "$manifest_digest" ]]; then
              echo "::error::Could not resolve digest for ${timestamp_tag}" >&2
              exit 1
            fi

            merged=$(jq -c --arg target "$target" --arg names "$names" --arg digest "$manifest_digest" \
              '. + [{key: $target, value: {"image.name": $names, "containerimage.digest": $digest}}]' <<< "$merged")
          done

          metadata=$(jq -c 'from_entries' <<< "$merged")
          echo "metadata=$metadata" >> "$GITHUB_OUTPUT"

      - name: Generated images
        env:
          BUILD_METADATA: ${{ steps.merge.outputs.metadata }}
        id: images
        run: |
          echo "images=$(jq -c '[ .[].\"image.name\" | split(\",\")[] | select(test(\"[0-9]{12}\")) ]' <<< "$BUILD_METADATA")" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign images
        env:
          BUILD_METADATA: ${{ steps.merge.outputs.metadata }}
        run: |
          jq -r '.[] | (."image.name" | sub(",.*";"")) + "@" + ."containerimage.digest"' <<< "$BUILD_METADATA" | \
            xargs cosign sign --yes

  security:
    name: Security checks
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
      security-events: write
    needs:
      - merge-images
    strategy:
      fail-fast: false
      matrix:
        image: ${{fromJson(needs.merge-images.outputs.images)}}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Security checks
        uses: cloudnative-pg/postgres-containers/.github/actions/security-scans@main
        with:
          image: "${{ matrix.image }}"
          registry_user: ${{ github.actor }}
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          snyk_token: ${{ secrets.SNYK_TOKEN }}
          dockerfile: "${{ inputs.extension_name }}/Dockerfile"

  generate-smoke-test-matrix:
    name: Generate matrix for smoke tests
    runs-on: ubuntu-26.04
    permissions: {}
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - name: Compute CNPG release matrix
        id: versions
        env:
          # renovate: datasource=github-tags depName=cloudnative-pg/cloudnative-pg versioning=semver-coerced extractVersion=^v(?<version>\d+\.\d+\.\d+)$
          LATEST_RELEASE: "1.30.1"
        run: |
          LATEST_MINOR="${LATEST_RELEASE%.*}"
          PREVIOUS_MINOR=$(awk -F. '{print $1"."$2-1}' <<< "$LATEST_MINOR")
          PREVIOUS_RELEASE=$(git ls-remote --tags --refs https://github.com/cloudnative-pg/cloudnative-pg "refs/tags/v${PREVIOUS_MINOR}.*" \
            | sed 's|.*refs/tags/v||' \
            | grep -E "^${PREVIOUS_MINOR//./\\.}\.[0-9]+$" \
            | sort -V | tail -n1)
          if [ -z "$PREVIOUS_RELEASE" ]; then
            echo "No release found for CNPG ${PREVIOUS_MINOR}" >&2
            exit 1
          fi
          versions=$(jq -cn --arg latest "$LATEST_RELEASE" --arg previous "$PREVIOUS_RELEASE" \
            '["main", $previous, $latest]')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  smoke-test:
    name: Smoke test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    needs:
      - merge-images
      - generate-smoke-test-matrix
    strategy:
      fail-fast: false
      matrix:
        image: ${{fromJson(needs.merge-images.outputs.images)}}
        cnpg: ${{fromJson(needs.generate-smoke-test-matrix.outputs.versions)}}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Install Dagger
        env:
          # renovate: datasource=github-tags depName=dagger/dagger versioning=semver
          DAGGER_VERSION: 0.21.10
        run: |
          curl -L https://dl.dagger.io/dagger/install.sh | BIN_DIR=$HOME/.local/bin sh

      - name: Set up environment
        env:
          CNPG_RELEASE: ${{ matrix.cnpg }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          task e2e:setup-env CNPG_RELEASE=$CNPG_RELEASE REGISTRY_HOST=ghcr.io REGISTRY_USERNAME="${REGISTRY_USERNAME}"

      - name: Generate Chainsaw testing values
        env:
          MATRIX_IMAGE: ${{ matrix.image }}
          EXTENSION_NAME: ${{ inputs.extension_name }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          task e2e:generate-values EXTENSION_IMAGE="${MATRIX_IMAGE}" TARGET="${EXTENSION_NAME}" REGISTRY_USERNAME="${REGISTRY_USERNAME}"

      - name: Run e2e tests
        env:
          EXTENSION_NAME: ${{ inputs.extension_name }}
        run: |
          task e2e:export-kubeconfig KUBECONFIG_PATH=./kubeconfig INTERNAL=true
          task e2e:test TARGET="${EXTENSION_NAME}" KUBECONFIG_PATH="./kubeconfig"

  copytoproduction:
    name: Copy images to production
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    needs:
      - merge-images
      - security
      - smoke-test
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Copy to production
        uses: cloudnative-pg/postgres-containers/.github/actions/copy-images@main
        with:
          bake_build_metadata: "${{ needs.merge-images.outputs.metadata }}"
          registry_user: ${{ github.actor }}
          registry_token: ${{ secrets.GITHUB_TOKEN }}
