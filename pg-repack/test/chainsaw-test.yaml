apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: verify-pg-repack-extension
spec:
  timeouts:
    apply: 5s
    assert: 3m
    delete: 30s
  description: Verify the pg_repack client from the image rewrites a bloated table
  steps:
  - name: Create a Cluster with the extension
    try:
    - apply:
        file: cluster.yaml
    - apply:
        file: database.yaml
    - assert:
        file: cluster-assert.yaml
    - assert:
        file: database-assert.yaml

  - name: Repack a table with the client mounted from the extension image
    try:
    - apply:
        file: check-extension.yaml
    - assert:
        file: check-extension-assert.yaml
