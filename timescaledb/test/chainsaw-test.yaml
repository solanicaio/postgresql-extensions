apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: verify-timescaledb-community
spec:
  timeouts:
    apply: 5s
    assert: 3m
    delete: 30s
  description: >-
    Verify that the Timescale License features (compression, policies and
    continuous aggregates) work for the application user.
  steps:
  - name: Create a Cluster with the extension
    try:
    - apply:
        file: cluster.yaml
    - apply:
        file: database.yaml
    - assert:
        file: cluster-assert.yaml
    - assert:
        file: database-assert.yaml

  - name: Verify Timescale License features as the application user
    try:
    - apply:
        file: check-extension.yaml
    - assert:
        file: check-extension-assert.yaml
