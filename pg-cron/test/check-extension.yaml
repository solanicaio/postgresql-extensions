apiVersion: batch/v1
kind: Job
metadata:
  name: extension-installed
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: data-test
        env:
          # Clear the image-baked PGSSLROOTCERT=system so libpq doesn't
          # try to verify the CNPG self-signed CA against the OS trust store.
          - name: PGSSLROOTCERT
          - name: EXT_VERSION
            value: ($values.version)
          - name: DB_URI
            valueFrom:
              secretKeyRef:
                name: (join('-', [$values.name, 'app']))
                key: uri
        # renovate: datasource=docker depName=alpine/psql versioning=docker
        image: alpine/psql:18.6@sha256:08f354a83552fcefa508116268463b371717577fe49d3fcb7b82cf8d2be464b8
        command: ['sh', '-c']
        args:
         - |
           set -e
           DB_URI=$(echo $DB_URI | sed "s|/\*|/|")
           test "$(psql "$DB_URI" -tAqc "SELECT rolsuper FROM pg_roles WHERE rolname = current_user")" = "f"
           test "$(psql "$DB_URI" -tAqc "SELECT EXISTS (SELECT FROM pg_catalog.pg_extension WHERE extname = 'pg_cron' AND extversion = '${EXT_VERSION}')")" = "t"
           psql "$DB_URI" -q -v ON_ERROR_STOP=1 <<'SQL'
           CREATE TABLE IF NOT EXISTS ticks (t timestamptz NOT NULL DEFAULT now());
           -- Named dollar quotes: Kubernetes collapses "$$" to "$" in args
           SELECT cron.schedule('tick', '1 seconds', $q$INSERT INTO ticks DEFAULT VALUES$q$);
           SQL
           for i in $(seq 1 30); do
             if [ "$(psql "$DB_URI" -tAqc "SELECT count(*) >= 2 FROM ticks")" = "t" ]; then break; fi
             sleep 1
           done
           test "$(psql "$DB_URI" -tAqc "SELECT count(*) >= 2 FROM ticks")" = "t"
           test "$(psql "$DB_URI" -tAqc "SELECT count(*) > 0 FROM cron.job_run_details WHERE status = 'succeeded' AND username = current_user")" = "t"
           psql "$DB_URI" -tAq -v ON_ERROR_STOP=1 -c "SELECT cron.unschedule('tick')"
           echo "pg_cron job scheduled and run as a non-superuser!"
