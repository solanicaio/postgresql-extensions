apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ($values.name)
spec:
  imageName: ($values.pg_image)
  instances: 1

  # CREATE EXTENSION creates the cron schema as the superuser through the
  # Database resource, so let app use schemas the superuser creates later.
  bootstrap:
    initdb:
      postInitApplicationSQL:
        - ALTER DEFAULT PRIVILEGES FOR ROLE postgres GRANT USAGE ON SCHEMAS TO app

  storage:
    size: 1Gi

  postgresql:
    parameters: ($values.postgresql_parameters)
    shared_preload_libraries: ($values.shared_preload_libraries)
    extensions: ($values.extensions)
